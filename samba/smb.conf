[global]
    workgroup = WORKGROUP
    server role = standalone server
    map to guest = Bad User
    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file

[sambashare]
    comment = Music application Samba share
    path = /data/sambashare
    browsable = yes
    read only = no
    guest ok = no
    valid users = k8s
    force user = k8s
    force group = samba
    create mask = 0777
    directory mask = 0777
