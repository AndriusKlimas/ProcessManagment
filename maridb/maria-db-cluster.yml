apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-repl
  namespace: music-app
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: rootPassword
  replicas: 1
  storage:
    size: 1Gi
    storageClassName: smb
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: catalog
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  name: catalog
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: login
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  name: login
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: history
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  name: history
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: mariadb-max
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  services:
    - name: rw-router
      router: readwritesplit
      listener:
        name: rw-router-listener
        port: 3306
        protocol: MariaDBProtocol
  kubernetesService:
    type: ClusterIP
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: catalog-app
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  name: catalog_app
  host: "%"
  passwordSecretKeyRef:
    name: mariadb-app
    key: catalogPassword
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: catalog-app
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  username: catalog_app
  host: "%"
  database: catalog
  table: "*"
  privileges:
    - ALL PRIVILEGES
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: login-app
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  name: login_app
  host: "%"
  passwordSecretKeyRef:
    name: mariadb-app
    key: loginPassword
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: login-app
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  username: login_app
  host: "%"
  database: login
  table: "*"
  privileges:
    - ALL PRIVILEGES
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: history-app
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  name: history_app
  host: "%"
  passwordSecretKeyRef:
    name: mariadb-app
    key: historyPassword
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: history-app
  namespace: music-app
spec:
  mariaDbRef:
    name: mariadb-repl
  username: history_app
  host: "%"
  database: history
  table: "*"
  privileges:
    - ALL PRIVILEGES
