apiVersion: v1
kind: ConfigMap
metadata:
  # Name used by the Fluent Bit DaemonSet volume mount.
  name: fluent-bit-config
  # Keep logging resources separate from application resources.
  namespace: logging
data:
  # Main Fluent Bit pipeline configuration.
  fluent-bit.conf: |-
    [SERVICE]
      Parsers_File parsers.conf

    [INPUT]
      Name http
      Port 9880

    [INPUT]
      Name tail
      Path /var/log/containers/*.log
      Tag kube.*
      Parser cri

    [OUTPUT]
      Name stdout
      Match *

  # Parser definitions used by fluent-bit.conf.
  parsers.conf: |-
    [PARSER]
      Name cri
      Format regex
      Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
      Time_Key time
      Time_Format %Y-%m-%dT%H:%M:%S.%L%z
      Time_Keep On
