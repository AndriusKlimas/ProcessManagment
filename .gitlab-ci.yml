stages:
  - test
  - build

pipeline-test:
  stage: test
  script:
    - echo "GitLab CI pipeline test succeeded"
    - 'echo "Commit: $CI_COMMIT_SHA"'
    - 'echo "Ref: $CI_COMMIT_REF_NAME"'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

build-job:
  stage: build
  script:
    - echo "Starting build job"
    - echo $SHELL
    - bash --version
    - python3 --version
    - echo "Environment variables set"
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
    - python3 build.py $CI_COMMIT_TAG
    - docker logout
  rules:
    - if: $CI_COMMIT_TAG
