apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-page-svc-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-page-svc
  template:
    metadata:
      labels:
        app: login-page-svc
    spec:
      containers:
      - name: login-page-svc
        image: andriuskl/login-page-svc:3.0.3
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "64Mi"
            cpu: "150m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_SENTINEL_HOST
          value: redis
        - name: REDIS_SENTINEL_PORT
          value: "26379"
        - name: REDIS_MASTER_NAME
          value: "mymaster"
        - name: REDIS_DB
          value: "1"
