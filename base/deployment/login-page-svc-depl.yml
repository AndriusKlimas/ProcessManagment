apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-page-svc-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-page-svc
  template:
    metadata:
      labels:
        app: login-page-svc
    spec:
      containers:
      - name: login-page-svc
        image: andriuskl/login-page-svc:3.0.1
        imagePullPolicy: IfNotPresent
        env:
        - name: MARIADB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MARIADB_HOST
        - name: MARIADB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MARIADB_PORT
        - name: MARIADB_USER
          value: login_app
        - name: MARIADB_DATABASE
          value: login
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-app
              key: loginPassword
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "150m"
        ports:
        - containerPort: 5000
