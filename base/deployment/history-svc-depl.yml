apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-svc-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-svc
  template:
    metadata:
      labels:
        app: history-svc
    spec:
      containers:
      - name: history-svc
        image: andriuskl/history-svc:2.0.5
        imagePullPolicy: IfNotPresent
        # Environment variables for MariaDB connection
        env:
        - name: MARIADB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MARIADB_HOST
        - name: MARIADB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MARIADB_PORT
        - name: MARIADB_USER
          value: history_app
        - name: MARIADB_DATABASE
          value: history
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-app
              key: historyPassword
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "200m"
        ports:
        - containerPort: 5000
