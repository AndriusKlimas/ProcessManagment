apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-svc-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-svc
  template:
    metadata:
      labels:
        app: catalog-svc
    spec:
      containers:
      - name: catalog-svc
        image: andriuskl/catalog-svc_1:3.0.2
        imagePullPolicy: IfNotPresent
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_SENTINEL_HOST
          value: redis
        - name: REDIS_SENTINEL_PORT
          value: "26379"
        - name: REDIS_MASTER_NAME
          value: "mymaster"
        - name: REDIS_DB
          value: "0"
