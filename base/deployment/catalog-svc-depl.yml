apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-svc-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-svc
  template:
    metadata:
      labels:
        app: catalog-svc
    spec:
      containers:
      - name: catalog-svc
        image: andriuskl/catalog-svc_1:3.0.1
        imagePullPolicy: IfNotPresent
        env:
        - name: MARIADB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MARIADB_HOST
        - name: MARIADB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MARIADB_PORT
        - name: MARIADB_USER
          value: catalog_app
        - name: MARIADB_DATABASE
          value: catalog
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-app
              key: catalogPassword
        # resources:
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        ports:
        - containerPort: 5000
