apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audio-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - host: localhost
    http:
      paths:
      - pathType: ImplementationSpecific
        path: /audio/(.*)
        backend:
          service:
            name: song-player-nginx
            port:
              number: 80
