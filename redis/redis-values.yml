architecture: replication
fullnameOverride: redis

auth:
  enabled: false

master:
  persistence:
    enabled: true
    size: 1Gi
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

replica:
  replicaCount: 3
  persistence:
    enabled: true
    size: 1Gi
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

sentinel:
  enabled: true
  masterSet: mymaster
  quorum: 2